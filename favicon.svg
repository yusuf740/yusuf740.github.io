<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Stylized Y + Neural Nodes emblem -->
  <path d="M 17 18 L 32 35 L 47 18" fill="none" stroke="#80dec4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 32 35 L 32 47" fill="none" stroke="#80dec4" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Connection Nodes -->
  <circle cx="17" cy="18" r="3.5" fill="#80dec4" />
  <circle cx="47" cy="18" r="3.5" fill="#80dec4" />
  <circle cx="32" cy="35" r="3.5" fill="#80dec4" />
  <circle cx="32" cy="47" r="2.5" fill="#80dec4" />
</svg>
